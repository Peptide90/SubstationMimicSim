name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      # Non-blocking for now: 25 pre-existing react-hooks correctness errors in
      # MimicDesignerV2 and the deferred multiplayer app. They are addressed as those
      # components are split up in Phase 1 (docs/PLATFORM-PLAN.md); flip to blocking then.
      - run: npm run lint
        continue-on-error: true
      - run: npm run test
      - run: npx vite build
